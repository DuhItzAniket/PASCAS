name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f ROADMAP.md
          test -f docs/sdlc/PROJECT-STATUS.md
          echo "All required documentation files present."

  build-core:
    name: Build core + console front-end (FPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: sudo apt-get update && sudo apt-get install -y fpc python3
      - name: Build
        run: python3 scripts/build.py

  test-core:
    name: Unit + golden tests
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: sudo apt-get update && sudo apt-get install -y fpc python3
      - name: Run test runners
        run: python3 scripts/runtests.py

  build-desktop:
    name: Build desktop LCL app (lazbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lazarus
        run: sudo apt-get update && sudo apt-get install -y lazarus python3
      - name: Build LCL app
        run: lazbuild app/desktop/pmstudio.lpi

  build-web:
    name: Build + verify web (pas2js + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pas2js 2.2.0 (pinned, with RTL)
        run: |
          cd /tmp
          curl -sSL -o p2js.zip https://downloads.freepascal.org/fpc/contrib/pas2js/2.2.0/pas2js-linux-2.2.0.zip
          unzip -q p2js.zip
          /tmp/pas2js-linux-2.2.0/bin/x86_64-linux/pas2js -iW
      - name: Build web app
        run: PAS2JS_EXE=/tmp/pas2js-linux-2.2.0/bin/x86_64-linux/pas2js python3 scripts/build_web.py
      - name: Verify core-as-JS under Node
        run: PAS2JS_EXE=/tmp/pas2js-linux-2.2.0/bin/x86_64-linux/pas2js python3 scripts/verify_web.py
